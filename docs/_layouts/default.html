<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
        <nav class="site-nav">
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/about/">About</a>
          <a href="{{ site.baseurl }}/blog/">Blog</a>
          <a href="{{ site.baseurl }}/research/">Research</a>
          <a href="{{ site.baseurl }}/analysis/">Analysis</a>
          <a href="{{ site.baseurl }}/data/">Data</a>
          <a href="{{ site.baseurl }}/contact/">Contact</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="container">
        {{ content }}
      </div>
    </main>

<footer class="site-footer">
  <div class="footer-inner container">
    <div class="footer-columns">

      <div class="footer-col">
        <h4>Standard</h4>
        <ul>
          <li><a href="{{ site.baseurl }}/">Home</a></li>
          <li><a href="{{ site.baseurl }}/about/">About</a></li>
          <li><a href="{{ site.baseurl }}/contact/">Contact</a></li>
          <li><a href="{{ site.baseurl }}/initiatives/">Initiatives</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>More</h4>
        <ul>
          <li><a href="{{ site.baseurl }}/research/">Research</a></li>
          <li><a href="{{ site.baseurl }}/analysis/">Analysis</a></li>
          <li><a href="{{ site.baseurl }}/data/">Data</a></li>
        </ul>
      </div>

    </div>
    <div class="footer-bottom">
      <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}</p>
    </div>
  </div>
</footer>

  </body>
</html>
